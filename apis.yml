aid: lightlogic
name: LightLogic
description: >-
  LightLogic was an optoelectronics company founded in January 1998 and
  headquartered in Newark, California. It designed and manufactured highly
  integrated optical modules — transmitters and receivers — for high-speed
  (10 Gb/s and up) fiber optic telecommunications equipment, specializing in the
  integration of lasers, micro-optics and high-speed electronics. Its marquee
  products were 10 Gb/s transponders providing optical-to-electrical conversion
  for SONET OC-192 and 10 Gigabit Ethernet applications, sold to optical
  networking OEMs building primarily metro-market systems. The company raised
  $57.5M and was backed by Bessemer Venture Partners, Cisco Systems, Infineon
  Technologies, Dassault Developpement, Infinity Capital, Lightspeed Venture
  Partners (then Weiss, Peck and Greer), Optical Capital Group, Ridge Ventures,
  Siemens Mustang Ventures and Viventures. LightLogic was acquired by Intel
  Corporation; by mid-2002 lightlogic.com redirected to Intel's optical
  transceiver product pages. This is a hardware component maker with no API,
  developer or software surface — historically or today — and the
  lightlogic.com domain no longer resolves.
